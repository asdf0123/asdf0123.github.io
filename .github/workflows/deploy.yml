name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - master
      - update_test

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Hexo site
        run: |
          git submodule status
          npx hexo clean
          npx hexo config
          npx hexo generate

       # 下载最终静态文件
      - name: Download static release
        uses: robinraju/release-downloader@v1
        with:
          repository: asdf0123/MyMusic
          latest: true
          fileName: "MyMusic.zip"
          out-file-path: ./
          token: ${{ secrets.PRIVATE_REPO_QUREY_TOKEN }}

      # 解压到 Hexo 输出目录
      - name: Extract static files into public
        run: |
          unzip -o ./MyMusic.zip -d ./public/music
          echo "Public directory:"
          ls -lah ./public/music

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
