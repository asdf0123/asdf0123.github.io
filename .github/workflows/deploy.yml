name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download public from private 
        uses: robinraju/release-downloader@v1
        with:
          repository: asdf0123/asdf0123.github.io.private
          latest: true
          fileName: "public.zip" #只有一个子文件夹public的压缩包
          out-file-path: ./
          token: ${{ secrets.PRIVATE_REPO_QUREY_TOKEN }}

      - name: Extract public
        run: |
          unzip -o ./public.zip -d ./
          ls -la public

       # 下载最终静态文件
      - name: Download my music
        uses: robinraju/release-downloader@v1
        with:
          repository: asdf0123/MyMusic
          latest: true
          fileName: "MyMusic.zip"
          out-file-path: ./
          token: ${{ secrets.PRIVATE_REPO_QUREY_TOKEN }}

      # 解压到 Hexo 输出目录
      - name: Extract static files into public
        run: |
          unzip -o ./MyMusic.zip -d ./public/music

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
